##############################################################################
# Nginx override for Azure App Service (Linux PHP containers)
#
# Azure's built-in PHP image uses Nginx as the web server. To customise it
# place this file at /home/site/wwwroot/.azure/nginx.conf and set the
# App Service startup command to:
#   cp /home/site/wwwroot/.azure/nginx.conf /etc/nginx/sites-available/default && service nginx reload && /home/site/wwwroot/.azure/startup.sh
#
# Or simply reference it via the Azure Portal → Configuration → Startup Command.
##############################################################################

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /home/site/wwwroot/public;

    index index.php index.html;

    server_name _;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;

    # Gzip
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml;

    client_max_body_size 100M;

    # Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass            unix:/run/php/php-fpm.sock;
        fastcgi_index           index.php;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param           PATH_INFO       $fastcgi_path_info;
        fastcgi_read_timeout    120s;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires    30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Dot-file protection
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Health probe
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
