# JavaScript / TypeScript — Objective Coding Rules
# Concise, machine-friendly. See coding-style.md for rationale.

formatting:
  blank_lines:
    between_related_statements: false # no extra blank lines inside tight blocks
    between_function_declarations: true # one blank line between top-level fns
  braces:
    single_statement_if: omit # never wrap one-liners in { }
    single_statement_else: omit
  declaration_collapsing:
    enabled: true
    max_declarations: 3 # merge up to 3 sequential const/let/var
  semicolons: always

naming:
  cached_strings: UPPER_SNAKE or camelCase # e.g. INFO_ICON or infoIcon
  modules: kebab-case # file names
  functions: camelCase
  classes: PascalCase

dom:
  preferred_query_order:
    - getElementById
    - getElementsByClassName
    - getElementsByTagName
    - HTMLFormElement.elements
    - querySelector
    - querySelectorAll
  observers:
    mutation: optional
    intersection: optional

patterns:
  dry_setAttribute:
    threshold: 3 # loop when ≥3 calls on same element
    style: "Object.entries loop"
  dry_property_assign:
    threshold: 3
    style: "Object.entries loop with bracket access"
  cached_strings:
    threshold: 2 # extract when used >2 times
  iife_try_catch:
    required: true
    catch_message: "[<module>] failed to initialise"
  one_liner_guards:
    prefer: short-circuit # !cond && action()
  symmetric_branches:
    prefer: ternary # cond ? a : b

jsdoc:
  function_declarations: required # at least one-line summary
  named_function_expressions: required
  arrow_callbacks: optional
  do_not_repeat_types: true # TS handles params/return types

es_target: ES6+
browser_support:
  - chromium
  - gecko

testing:
  after_changes:
    - jest
    - playwright
    - eslint
    - tsc --noEmit
  performance:
    benchmark_before_switching: true

cache_strings_regexp:
  description: >
    Strings used 2+ times must be stored as const. RegExp instances
    follow the same rule. Shared cross-file strings go in .constants.ts
    inside a deep-frozen Record (Object.freeze).
  threshold: 2
  shared_file: ".constants.ts"
  shared_format: "Object.freeze({ ... } as const)"
  regexp_caching:
    enabled: true
    threshold: 1 # always cache RegExp at module scope

sequential_to_iterative:
  description: >
    Repetitive sequential calls (appendChild chains, .style assignments,
    jQuery .removeClass) must be converted to loops or combined calls.
  patterns:
    appendChild_chain: "for (const [p,c] of pairs) p.appendChild(c)"
    style_assignments: "Object.assign(el.style, { ... })"
    jquery_remove_class: "el.removeClass('a b c') — space-separated"

event_listener_guards:
  description: >
    Before addEventListener, check el.dataset.<name>Bound. Set it to
    "1" after binding. Prevents duplicate registrations on re-execution.
  check: "el.dataset.<name>Bound"
  set_after_bind: '"1"'

inline_single_use:
  description: >
    Variables assigned once and used once should be inlined directly
    unless the name significantly improves readability.
  exceptions:
    - complex_expressions_where_name_adds_clarity
    - debugging_convenience

vendor_file_marking:
  description: >
    All third-party/vendor/bundle TS files inside ts/src/ must have
    '// # ! VENDOR FILE — DO NOT EDIT' as the first non-empty line.
    The path must also be excluded from tsconfig.json and eslint.config.mjs.
  header: "// # ! VENDOR FILE — DO NOT EDIT"
  required_config_entries:
    - tsconfig.json > exclude
    - eslint.config.mjs > ignores
  current_files:
    - public/assets/js/vendor-all.ts
    - public/js/cookieconsent.ts
    - public/js/site.ts
    - public/js/app.ts
    - public/Modules/landingpage/js/vendor-all.ts
    - public/Modules/landingpage/js/app.ts

eslint_migration_config:
  description: >
    During JS→TS migration certain rules are disabled to avoid
    thousands of false-positive warnings from idiomatic DOM patterns.
    Re-enable after full retyping.
  disabled_rules:
    - rule: "@typescript-eslint/strict-boolean-expressions"
      reason: "~1100 false positives from defensive if(el)/if(str) null-guards"
    - rule: "@typescript-eslint/no-unnecessary-condition"
      reason: "~1300 false positives from truthy checks on runtime-nullable values"
  vars_ignore_pattern: "^_|^\\$|^jQuery|^bootstrap|^feather|^SimpleBar|^dragula"
  caught_errors_ignore_pattern: ".*"

async_return_types:
  description: >
    Async functions must use Promise<void>, never bare void.
    Functions returning a value should let TypeScript infer the type
    and use eslint-disable-next-line for explicit-function-return-type.
  rules:
    non_async_void: ": void"
    async_void: ": Promise<void>"
    async_bare_void: forbidden # tsc error TS1064
    complex_inferred_returns: "eslint-disable-next-line @typescript-eslint/explicit-function-return-type"

eslint_disable_patterns:
  description: >
    eslint-disable-next-line should be used sparingly and only when
    the rule cannot be satisfied without worse code.
  rules:
    never_inside_template_literals: true
    combine_multiple_rules_in_one_comment: true
    add_reason_when_non_obvious: true
    prefer_fixing_root_cause: true
