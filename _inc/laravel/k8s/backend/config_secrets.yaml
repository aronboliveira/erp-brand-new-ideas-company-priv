apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-backend-config
  namespace: default
data:
  APP_Name: "ERP Go"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://erp.example.com"
  LOG_CHANNEL: "stack"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service" # Assuming a separate MySQL service or external DB
  DB_PORT: "3306"
  BROADCAST_DRIVER: "log"
  CACHE_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  SESSION_DRIVER: "redis"
  REDIS_HOST: "redis-service"

---
apiVersion: v1
kind: Secret
metadata:
  name: erp-backend-secrets
  namespace: default
stringData:
  # Secrets are mocked here. In production, use Azure Key Vault or sealed secrets.
  APP_KEY: "" # base64: ...
  DB_DATABASE: "erp_db"
  DB_USERNAME: "erp_user"
  DB_PASSWORD: "secure_password"
  REDIS_PASSWORD: ""
