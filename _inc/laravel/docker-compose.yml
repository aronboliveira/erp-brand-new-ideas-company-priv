version: "3.8"
services:
    app:
        build: .
        image: erp-backend-app
        container_name: erp-backend-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
        env_file:
            - .env
        ports:
            - "9000:9000"
    nginx:
        image: nginx:alpine
        container_name: erp-backend-nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
