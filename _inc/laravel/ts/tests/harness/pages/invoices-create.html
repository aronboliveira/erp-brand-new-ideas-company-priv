<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="test-csrf-token">
  <title>invoices.create - Test Harness</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
  <style>
    .test-status { padding: 1rem; margin: 1rem 0; border-radius: 0.5rem; }
    .test-status.pass { background: #d4edda; color: #155724; }
    .test-status.fail { background: #f8d7da; color: #721c24; }
    .test-status.loading { background: #fff3cd; color: #856404; }
    .mock-data { display: none; }
  </style>
</head>
<body>
  <div class="container-fluid py-3">
    <h1 class="h4 mb-3">invoices.create</h1>
    <div class="test-status loading" id="test-status">Loading scripts...</div>
    
    <!-- Mock content area -->
    
    <div class="card">
      <div class="card-header">Create invoices</div>
      <div class="card-body">
        <form id="main-form" action="#" method="POST">
          <input type="hidden" name="_token" value="test-csrf-token">
          
          
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" value="" required>
            <div class="invalid-feedback">Name is required</div>
          </div>
          
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
          </div>
          
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
              <option value="active" >Active</option>
              <option value="inactive">Inactive</option>
              <option value="pending">Pending</option>
            </select>
          </div>
          
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" id="submit-btn">Create</button>
            <a href="#" class="btn btn-secondary" id="cancel-btn">Cancel</a>
          </div>
        </form>
      </div>
    </div>
    
    <!-- Toast container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="successToast" class="toast" role="alert">
        <div class="toast-header">
          <strong class="me-auto">Success</strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body">Operation completed successfully.</div>
      </div>
      <div id="errorToast" class="toast bg-danger text-white" role="alert">
        <div class="toast-header bg-danger text-white">
          <strong class="me-auto">Error</strong>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body">An error occurred.</div>
      </div>
    </div>
    
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
          crossorigin="anonymous"></script>
  
    <script type="module" src="/dist/public/assets/js/routes/invoices/createIndex.js"></script>
  <script type="module" src="/dist/public/assets/js/routes/invoices/lang/create.js"></script>
  <script type="module" src="/dist/public/assets/js/routes/invoices/customers/store.js"></script>
  <script type="module" src="/dist/public/assets/js/routes/invoices/selectItem.js"></script>
  <script type="module" src="/dist/public/assets/js/routes/invoices/createIndexAnchor.js"></script>
  <script type="module" src="/dist/public/assets/js/routes/invoices/store.js"></script>
  
  <script type="module">
    window.addEventListener('load', () => {
      const status = document.getElementById('test-status');
      // Check if scripts loaded without errors
      const hasErrors = window.__testErrors?.length > 0;
      status.textContent = hasErrors ? 'Script errors detected' : 'Scripts loaded successfully';
      status.className = 'test-status ' + (hasErrors ? 'fail' : 'pass');
    });
    window.__testErrors = [];
    window.onerror = (msg, url, line, col, err) => {
      window.__testErrors.push({ msg, url, line, col, err: err?.message });
    };
  </script>
</body>
</html>
