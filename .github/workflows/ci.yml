###############################################################################
# ERP Brand New Ideas Company — GitHub Actions CI/CD
#
# Pipeline:
#   1. Lint (PHPStan, ESLint, Flake8, mypy, tsc)
#   2. Test (PHPUnit, Jest, Pytest, Playwright)
#   3. Build Docker image
#   4. (Comentado) Deploy para Azure AKS
#
# Triggers: push/PR em main e develop
###############################################################################
name: ERP Brand New Ideas Company CI/CD

on:
    push:
        branches: [main, develop]
        paths:
            - "_inc/laravel/**"
            - ".github/workflows/**"
    pull_request:
        branches: [main, develop]
        paths:
            - "_inc/laravel/**"
            - ".github/workflows/**"

env:
    PHP_VERSION: "8.4"
    NODE_VERSION: "22"
    PYTHON_VERSION: "3.11"
    LARAVEL_DIR: "_inc/laravel"
    # ── Azure (comentado — não utilizado por enquanto) ────────────────────
    # AZURE_ACR_NAME: erpacr
    # AZURE_ACR_LOGIN: erpacr.azurecr.io
    # AZURE_RG: erp-rg
    # AZURE_AKS_CLUSTER: erp-aks
    # IMAGE_NAME: erp-brand-new-ideas-company-app

jobs:
    # ════════════════════════════════════════════════════════════════════════
    # LINT — Análise estática multi-linguagem
    # ════════════════════════════════════════════════════════════════════════
    lint:
        name: Lint & Static Analysis
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ env.LARAVEL_DIR }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            # ── PHP ──────────────────────────────────────────────────────────
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, xml, zip, opcache
                  tools: composer:v2
                  coverage: none

            - name: Composer cache
              uses: actions/cache@v5
              with:
                  path: ${{ env.LARAVEL_DIR }}/vendor
                  key: composer-${{ hashFiles('_inc/laravel/composer.lock') }}
                  restore-keys: composer-

            - name: Composer install
              run: composer install --prefer-dist --no-interaction --no-scripts --optimize-autoloader

            - name: PHPStan
              continue-on-error: true  # known issues tracked in KNOWN_ISSUES.md; non-blocking until resolved
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: PHP_CodeSniffer
              continue-on-error: true  # informational; non-blocking
              run: vendor/bin/phpcs --standard=php_cs.xml --report=summary app/

            # ── Node.js ──────────────────────────────────────────────────────
            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"
                  cache-dependency-path: ${{ env.LARAVEL_DIR }}/package-lock.json

            - name: npm ci
              run: npm ci

            - name: npm audit fix
              continue-on-error: true  # advisory; may have unfixable vulns
              run: npm audit fix --ignore-scripts

            - name: ESLint
              continue-on-error: true  # scope too wide (P2-1); non-blocking until eslint.config.mjs is fixed
              run: npx eslint public/assets/js/ --ext .js --max-warnings=50

            - name: TypeScript check
              continue-on-error: true  # TS path aliases not yet configured; non-blocking
              run: npx tsc --noEmit

            # ── Python ───────────────────────────────────────────────────────
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Python lint deps
              run: pip install flake8 mypy

            - name: Flake8
              continue-on-error: true  # informational; non-blocking
              run: python3 -m flake8 tests/python/ resources/python/ --max-line-length=120

            - name: mypy
              continue-on-error: true  # informational; non-blocking
              run: python3 -m mypy tests/python/ resources/python/ --ignore-missing-imports

    # ════════════════════════════════════════════════════════════════════════
    # TEST-PHP — PHPUnit (requires MySQL)
    # ════════════════════════════════════════════════════════════════════════
    test-php:
        name: PHPUnit Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ env.LARAVEL_DIR }}

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: erp_brand_new_ideas_company_test
                    MYSQL_USER: test
                    MYSQL_PASSWORD: test
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                    --health-start-period=60s

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=3s
                    --health-retries=3

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: bcmath, exif, gd, intl, mbstring, pcntl, pdo_mysql, xml, zip, opcache, redis
                  tools: composer:v2
                  coverage: none

            - name: Composer install
              run: composer install --prefer-dist --no-interaction --no-scripts --optimize-autoloader

            - name: Prepare .env
              run: |
                  cp .env.example .env
                  sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
                  sed -i 's/DB_USERNAME=.*/DB_USERNAME=test/' .env
                  sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=test/' .env
                  sed -i 's/DB_DATABASE=.*/DB_DATABASE=erp_brand_new_ideas_company_test/' .env
                  sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
                  php artisan key:generate

            - name: Run migrations (with FK checks disabled)
              run: |
                  mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL FOREIGN_KEY_CHECKS=0; GRANT ALL ON *.* TO 'test'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;" 2>/dev/null || true
                  php artisan migrate:fresh --seed --force

            - name: PHPUnit
              continue-on-error: true  # 1 known failure in CI (env diff); tracked in PEND-14
              run: php -d memory_limit=4G vendor/bin/phpunit --no-coverage

    # ════════════════════════════════════════════════════════════════════════
    # TEST-JS — Jest + Playwright
    # ════════════════════════════════════════════════════════════════════════
    test-js:
        name: JavaScript Tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: ${{ env.LARAVEL_DIR }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"
                  cache-dependency-path: ${{ env.LARAVEL_DIR }}/package-lock.json

            - name: npm ci
              run: npm ci

            - name: Jest (CJS)
              run: npx jest --config jest.config.cjs --verbose

            - name: Jest (TS)
              run: |
                  cd tests/frontend/js
                  npx jest --verbose

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Playwright (frontend mock pages)
              continue-on-error: true  # Chromium download slow in CI; non-blocking
              run: npx playwright test --config=playwright-frontend.config.cjs --project=chromium --reporter=list

    # ════════════════════════════════════════════════════════════════════════
    # TEST-PYTHON — pytest
    # ════════════════════════════════════════════════════════════════════════
    test-python:
        name: Python Tests
        runs-on: ubuntu-latest
        needs: lint
        defaults:
            run:
                working-directory: ${{ env.LARAVEL_DIR }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install Python test deps
              run: |
                  pip install pytest pytest-cov flake8 mypy pandas requests openpyxl

            - name: pytest
              run: python3 -m pytest tests/python/ -v

    # ════════════════════════════════════════════════════════════════════════
    # BUILD — Docker image build (verificação de build)
    # ════════════════════════════════════════════════════════════════════════
    build:
        name: Docker Build
        runs-on: ubuntu-latest
        needs: [test-php, test-python]
        defaults:
            run:
                working-directory: ${{ env.LARAVEL_DIR }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                  context: ${{ env.LARAVEL_DIR }}
                  file: ${{ env.LARAVEL_DIR }}/Dockerfile
                  push: false
                  tags: erp-brand-new-ideas-company-app:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

