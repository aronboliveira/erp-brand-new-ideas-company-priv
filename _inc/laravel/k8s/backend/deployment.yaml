###############################################################################
# ERP Brand New Ideas Company — Backend Deployment (PHP-FPM + Nginx sidecar)
# Imagem local construída via: eval $(minikube docker-env) && docker build -t erp-brand-new-ideas-company-app .
# Para Azure (comentado): acr-name.azurecr.io/erp-backend:latest
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
    name: erp-backend
    namespace: erp-brand-new-ideas-company
    labels:
        app: erp-backend
        app.kubernetes.io/part-of: erp-brand-new-ideas-company
spec:
    replicas: 1
    selector:
        matchLabels:
            app: erp-backend
    template:
        metadata:
            labels:
                app: erp-backend
        spec:
            initContainers:
                # Copia somente public/ (assets estáticos) para volume compartilhado com nginx
                - name: copy-public
                  image: erp-brand-new-ideas-company-app:latest
                  imagePullPolicy: Never
                  command: ["/bin/sh", "-c", "cp -a /var/www/public/. /shared/public/"]
                  volumeMounts:
                      - name: public-assets
                        mountPath: /shared/public
            containers:
                # ── PHP-FPM Application Container ──────────────────────────────────
                - name: php-fpm
                  # image: acr-name.azurecr.io/erp-backend:latest  # Azure ACR (comentado)
                  image: erp-brand-new-ideas-company-app:latest
                  imagePullPolicy: Never # Usa imagem local do minikube Docker daemon
                  ports:
                      - containerPort: 9000
                        name: fastcgi
                  envFrom:
                      - configMapRef:
                            name: erp-backend-config
                      - secretRef:
                            name: erp-backend-secrets
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "100m"
                      limits:
                          memory: "1Gi"
                          cpu: "500m"
                  # PHP-FPM uses /var/www from the image directly (no volume overlay)
                  readinessProbe:
                      tcpSocket:
                          port: 9000
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  livenessProbe:
                      tcpSocket:
                          port: 9000
                      initialDelaySeconds: 15
                      periodSeconds: 20

                # ── Nginx Sidecar Container ────────────────────────────────────────
                - name: nginx
                  image: nginx:1-alpine
                  ports:
                      - containerPort: 80
                        name: http
                  volumeMounts:
                      - name: nginx-config
                        mountPath: /etc/nginx/conf.d/default.conf
                        subPath: default.conf
                      - name: public-assets
                        mountPath: /var/www/public
                  resources:
                      requests:
                          memory: "64Mi"
                          cpu: "50m"
                      limits:
                          memory: "128Mi"
                          cpu: "250m"
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 80
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 80
                      initialDelaySeconds: 15
                      periodSeconds: 20
            volumes:
                - name: nginx-config
                  configMap:
                      name: nginx-config
                - name: public-assets
                  emptyDir:
                      medium: Memory

---
apiVersion: v1
kind: Service
metadata:
    name: erp-backend
    namespace: erp-brand-new-ideas-company
    labels:
        app: erp-backend
spec:
    selector:
        app: erp-backend
    ports:
        - name: http
          protocol: TCP
          port: 80
          targetPort: 80
    type: ClusterIP
