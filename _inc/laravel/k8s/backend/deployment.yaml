apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-backend
  namespace: default
  labels:
    app: erp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-backend
  template:
    metadata:
      labels:
        app: erp-backend
    spec:
      containers:
      # PHP-FPM Application Container
      - name: php-fpm
        image: acr-name.azurecr.io/erp-backend:latest # Replace with actual image
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
          name: fastcgi
        envFrom:
        - configMapRef:
            name: erp-backend-config
        - secretRef:
            name: erp-backend-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: app-code
          mountPath: /var/www
        lifecycle:
          postStart:
             exec:
               command: ["/bin/sh", "-c", "cp -r /var/www/* /shared/www/"] # Copy code for nginx if shared volume

      # Nginx Sidecar Container
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: app-code
          mountPath: /var/www  # Shared volume for static files
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"

      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: app-code
        emptyDir: {}  # Shared volume for code/static assets

---
# Service for Backend
apiVersion: v1
kind: Service
metadata:
  name: erp-backend
  namespace: default
spec:
  selector:
    app: erp-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
