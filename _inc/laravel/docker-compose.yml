###############################################################################
# ERP Nova Prestech — Docker Compose stack
#
# Usage:
#   cp .env.example .env            # adjust DB_*, REDIS_*, APP_KEY, etc.
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --seed
#
# Services:
#   app   — PHP 8.3-FPM (Laravel)       port 9000
#   nginx — reverse-proxy                port 8080 → 80
#   db    — MySQL 8.0                    port 3306
#   redis — cache / queue / sessions     port 6379
###############################################################################

services:
    # ── PHP application ─────────────────────────────────────────────────────
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: erp-prestech-app
        container_name: erp-prestech-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
        env_file:
            - .env
        environment:
            DB_HOST: db
            REDIS_HOST: redis
            SESSION_SECURE_COOKIE: "false"
        healthcheck:
            test: ["CMD-SHELL", "php-fpm-healthcheck 2>/dev/null || kill -0 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - erp-net

    # ── Nginx ────────────────────────────────────────────────────────────────
    nginx:
        image: nginx:1-alpine
        container_name: erp-prestech-nginx
        restart: unless-stopped
        ports:
            - "${NGINX_PORT:-8080}:80"
        volumes:
            - .:/var/www
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - erp-net

    # ── MySQL ────────────────────────────────────────────────────────────────
    db:
        image: mysql:8.0
        container_name: erp-prestech-db
        restart: unless-stopped
        ports:
            - "${DB_PORT:-3306}:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-erp_prestech_db}
            MYSQL_USER: ${DB_USERNAME:-test}
            MYSQL_PASSWORD: ${DB_PASSWORD:-test}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        volumes:
            - erp-db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - erp-net

    # ── Redis ────────────────────────────────────────────────────────────────
    redis:
        image: redis:7-alpine
        container_name: erp-prestech-redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - erp-redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 3
        networks:
            - erp-net

volumes:
    erp-db-data:
        driver: local
    erp-redis-data:
        driver: local

networks:
    erp-net:
        driver: bridge
