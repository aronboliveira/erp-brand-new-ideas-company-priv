<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="test-csrf-token-12345" />
    <title>Test: attendances/delete.js</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .test-status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
      }
      .test-status.pass {
        background: #d4edda;
        color: #155724;
      }
      .test-status.fail {
        background: #f8d7da;
        color: #721c24;
      }
      .test-status.pending {
        background: #fff3cd;
        color: #856404;
      }
      #test-output {
        font-family: monospace;
        font-size: 12px;
        max-height: 300px;
        overflow: auto;
        border: 1px solid #ddd;
        padding: 10px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Test: attendances/delete.js</h1>
      <p class="text-muted">Testing compiled TypeScript route handler</p>
      <div id="test-status" class="test-status pending">Status: Loading...</div>
      <div id="test-output"></div>
      <hr />

      <!-- DOM elements expected by attendances/delete.js -->
      <div class="card">
        <div class="card-header">Attendance Delete Links</div>
        <div class="card-body">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>John Doe</td>
                <td>2026-03-08</td>
                <td>
                  <a
                    href="#"
                    id="delete-attendance-link-1"
                    data-url=""
                    data-guard-msg="Cannot delete attendance #1. Contact admin."
                  >
                    <i class="bi bi-trash"></i> Delete
                  </a>
                </td>
              </tr>
              <tr>
                <td>2</td>
                <td>Jane Smith</td>
                <td>2026-03-07</td>
                <td>
                  <a
                    href="#"
                    id="delete-attendance-link-2"
                    data-url=""
                    data-guard-msg="Cannot delete attendance #2. Contact admin."
                  >
                    <i class="bi bi-trash"></i> Delete
                  </a>
                </td>
              </tr>
              <tr>
                <td>3</td>
                <td>Bob Wilson</td>
                <td>2026-03-06</td>
                <td>
                  <!-- This one has a valid URL so should navigate -->
                  <a
                    href="/attendances/3/delete"
                    id="delete-attendance-link-3"
                    data-url="/attendances/3/delete"
                  >
                    <i class="bi bi-trash"></i> Delete
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Toast container will be created by the script if needed -->
    </div>

    <!-- Bootstrap 5 Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Test utilities -->
    <script>
      window.testLog = [];
      window.logTest = function (msg, isError = false) {
        const entry = { time: new Date().toISOString(), msg, isError };
        window.testLog.push(entry);
        const output = document.getElementById("test-output");
        if (output) {
          output.innerHTML +=
            '<div style="color:' +
            (isError ? "red" : "green") +
            '">[' +
            entry.time.split("T")[1].split(".")[0] +
            "] " +
            msg +
            "</div>";
        }
        console[isError ? "error" : "log"](msg);
      };
      window.setTestStatus = function (status, msg) {
        const el = document.getElementById("test-status");
        if (el) {
          el.className = "test-status " + status;
          el.textContent = "Status: " + msg;
        }
      };
      window.onerror = function (msg, url, line, col, error) {
        window.logTest("ERROR: " + msg + " at " + url + ":" + line, true);
        window.setTestStatus("fail", "Script error occurred");
        return false;
      };
    </script>

    <!-- The compiled TypeScript route -->
    <script
      type="module"
      src="/dist/public/assets/js/routes/attendances/delete.js"
    ></script>

    <!-- Test verification (type=module so it runs after the route module) -->
    <script type="module">
      // Small delay to ensure the route script has executed
      await new Promise(r => setTimeout(r, 100));

      try {
        window.logTest("Script loaded successfully");

        // Verify the delete links have event listeners attached
        const links = document.querySelectorAll(
          '[id^="delete-attendance-link-"]',
        );
        window.logTest("Found " + links.length + " delete links");

        // Check if data-listening attribute was set (indicates script ran)
        let listenersAttached = 0;
        links.forEach(function (link) {
          if (link.hasAttribute("data-listening-deleteattendanceclick")) {
            listenersAttached++;
          }
        });

        window.logTest(
          "Listeners attached to " +
            listenersAttached +
            "/" +
            links.length +
            " links",
        );

        if (listenersAttached === links.length && links.length > 0) {
          window.setTestStatus(
            "pass",
            "All tests passed - " + listenersAttached + " listeners attached",
          );
        } else if (listenersAttached > 0) {
          window.setTestStatus(
            "pending",
            "Partial success - " +
              listenersAttached +
              "/" +
              links.length +
              " listeners",
          );
        } else {
          window.setTestStatus("fail", "No listeners attached");
        }

        // Test clicking link #1 (should show toast, not navigate)
        window.logTest("Testing click on link #1 (should show toast)...");
        const link1 = document.getElementById("delete-attendance-link-1");
        if (link1) {
          link1.click();
          // Check if toast was created
          await new Promise(r => setTimeout(r, 500));
          const toastContainer = document.getElementById("toast-container");
          if (toastContainer && toastContainer.querySelector(".toast")) {
            window.logTest("Toast created successfully after click");
          } else {
            window.logTest(
              "Note: Toast may have been created but not visible (Bootstrap timing)",
            );
          }
        }
      } catch (e) {
        window.logTest("Test error: " + e.message, true);
        window.setTestStatus("fail", "Test execution failed");
      }
    </script>
  </body>
</html>
