## ──────────────────────────────────────────────────────────────
## FILESYSTEM ARCHITECTURE MAP
## ──────────────────────────────────────────────────────────────
## Root: erp_brand_new_ideas_company/
##   ├── _inc/laravel/                     ⭐ Main application workspace
##   │   ├── .notes/                        Durable team notes (issues, plans, work journal)
##   │   │   ├── .llms/                    ★ Unified guideline tree (primary + app-specific)
##   │   │   │   ├── .guidelines/          ★ Guideline directories by domain
##   │   │   │   │   ├── project.yml       Global config
##   │   │   │   │   ├── constraints.md    Hard rules
##   │   │   │   │   ├── backend/          PHP/Laravel (architecture, constants, controllers, models, services, middleware)
##   │   │   │   │   ├── database/         Migrations, seeders, DB conventions
##   │   │   │   │   ├── frontend/         Blade, JS singletons, ESM→IIFE, TS, template-literal testing
##   │   │   │   │   ├── infrastructure/   server.toml
##   │   │   │   │   ├── modules/          accounting, billing, crm, hrm, planning, products
##   │   │   │   │   ├── roles/            agent-roles.md
##   │   │   │   │   ├── security/         security-patterns.xml + roleplay maps
##   │   │   │   │   └── testing/          CI, test-architecture, test suites, TS harness
##   │   │   │   ├── .history/             reports/
##   │   │   │   ├── README.md
##   │   │   │   ├── route-view-testing-pattern.md
##   │   │   │   └── typescript-migration.md
##   │   │   ├── .history/                 ESLint/PHPStan logs
##   │   │   ├── CURRENT_WORKING_ISSUES.md 462-line chronological bug-fix session log
##   │   │   ├── CURRENT_WORKING_ISSUES_WORK.md 568-line try/fail/success work journal
##   │   │   ├── KNOWN_ISSUES.md          194-line open issues (test suite, performance, route failures)
##   │   │   ├── NEXT_STEPS.md            105-line immediate/deferred tasks list
##   │   │   ├── RESOLVED_ISSUES.md       37-line resolved issues archive
##   │   │   ├── TODO_LATER.MD            3-line placeholder for deferred CSP task
##   │   │   ├── README.md                Overview of notes tree
##   │   │   ├── README_INFRA.md          Infrastructure and tooling context map
##   │   │   └── README_UTILS.md          Laravel project utilities documentation
##   │   ├── utils/                        Developer tooling workspace
##   │   │   ├── .llms/                    LLM CLI logs, agent context, session notes, scripts
##   │   │   │   ├── ctx/                  erp_context.md + agents/ (backend, frontend, infrastructure)
##   │   │   │   ├── cli/                  Dated CLI command logs
##   │   │   │   ├── notes/{date}/*.md     Chronological working notes
##   │   │   │   └── scripts/              Agent scripts
##   │   │   ├── prompts/.guidelines/      ★ CODING STYLE guidelines (multi-format: md/toml/xml/yml)
##   │   │   │   ├── general/              coding-conventions, error-handling, markup-accessibility
##   │   │   │   ├── css/                  styling
##   │   │   │   ├── javascript/           coding-rules, script-tags, singletons
##   │   │   │   ├── php/                  blade, controllers, financial, i18n, migrations, models, routes, seeders, testing, transpilation
##   │   │   │   ├── python/               coding-conventions, spreadsheets
##   │   │   │   ├── react/                components
##   │   │   │   └── typescript/           type-safety
##   │   │   ├── scripts/                  Reusable scripts (sh/, py/, js/, php/, ts-harness/)
##   │   │   ├── cli/                      Dated CLI command logs
##   │   │   ├── grep/                     Dated grep command notes
##   │   │   ├── regex/                    Dated regex pattern notes
##   │   │   ├── find/                     Dated find command notes
##   │   │   ├── cmds/                     Quick-command scripts
##   │   │   ├── logs/                     Runtime logs
##   │   │   ├── caches/                   Cached outputs
##   │   │   ├── containers/               Container helpers
##   │   │   ├── assets/                   Utility assets
##   │   │   ├── README.md
##   │   │   ├── FINANCE_AUDIT.md
##   │   │   ├── ROUTE_MAP.md
##   │   │   ├── CSS_FILE_PATTERN.md
##   │   │   ├── JAVASCRIPT_FILE_PATTERN.md
##   │   │   ├── TYPESCRIPT_FILE_PATTERN.md
##   │   │   ├── REPORT_FILE_PATTERN.md
##   │   │   └── regexes.txt
##   │   └── ... (Modules/LandingPage, app/, resources/, routes/, database/, tests/, …)
##   │
##   ├── _old/                             Legacy fork (reference only, do NOT develop)
##   ├── origin/                           Upstream upstream source (read-only)
##   ├── notes/                            Team documentation (stale — see _inc/laravel/.notes/)
##   │   ├── CURRENT_WORKING_ISSUES.md     Route health report (2026-02-07)
##   │   └── KNOWN_ISSUES.md               Known/resolved issues
##   ├── .notes/                           Root-level hidden notes (mostly migrated)
##   │   ├── .llms/.guidelines/            Legacy guideline tree (mirrored from _inc/laravel/.notes/)
##   │   ├── .history/                     Legacy archival
##   │   ├── MOVED_README.md               Migration notice
##   │   └── README.md                     Directory overview
##   ├── utils/                            Monorepo-level context
##   │   └── .llms/
##   ├── .agents/                          Agent config (empty)
##   ├── .backup/                          Backup files for contingency
##   ├── .deprecated/                      Deprecated code (Django, Flutter, old frontend)
##   ├── .gh/                              GitHub helpers (sudo.yml)
##   ├── .github/                          GitHub Actions CI
##   ├── .claude/                          Claude AI settings
##   ├── .history/                         Root-level historical archives
##   ├── .tmp/                             Volatile temp files
##   └── .venv/                            Python 3.13 virtual environment
## ──────────────────────────────────────────────────────────────

starters:
    workspaces:
        - app: _inc/laravel/*
        - infra-os-utils: _inc/laravel/utils/*
    documentation:
        - README.md
        - .notes/*.md                             # Monorepo-wide notes (architecture, general infra)
        - _inc/laravel/.notes/{.llms/.guidelines/*,*.md} # App-specific notes (Laravel logic, bugs, tasks)
        - _inc/laravel/utils/{.llms/*,prompts/.guidelines/*,*.md}
    guidelines:
        # ── MANDATORY READS ─────────────────────────────────────
        # LLM agents and developers MUST check these paths before
        # coding, reviewing, or issuing commands in the workspace.
        # ────────────────────────────────────────────────────────
        architecture-map:
            note: "Refer to the FILESYSTEM ARCHITECTURE MAP at the top of this file for the full directory tree."
            primary-guidelines:   _inc/laravel/.notes/.llms/.guidelines/
            coding-style-guides:  _inc/laravel/utils/prompts/.guidelines/
            app-specific:         _inc/laravel/.notes/.llms/
            agent-context:        _inc/laravel/utils/.llms/ctx/agents/
        agent-config:
            - .agent.md
            - .instructions.md
            - AGENTS.md
            - copilot-instructions.md
        coding-style:
            - .editorconfig
            - .prettierrc
        domain-guidelines-index:
            backend:
                - _inc/laravel/.notes/.llms/.guidelines/backend/erp-architecture.md
                - _inc/laravel/.notes/.llms/.guidelines/backend/naming-conventions.yml
                - _inc/laravel/.notes/.llms/.guidelines/backend/constants_map.json
                - _inc/laravel/.notes/.llms/.guidelines/backend/middleware_pipeline.xml
                - _inc/laravel/.notes/.llms/.guidelines/backend/controllers/controller-patterns.md
                - _inc/laravel/.notes/.llms/.guidelines/backend/models/model-conventions.md
                - _inc/laravel/.notes/.llms/.guidelines/backend/services/delegation-patterns.md
            database:
                - _inc/laravel/.notes/.llms/.guidelines/database/database-guide.md
            frontend:
                - _inc/laravel/.notes/.llms/.guidelines/frontend/esm-iife-strategy.md
                - _inc/laravel/.notes/.llms/.guidelines/frontend/template-literal-testing.md
                - _inc/laravel/.notes/.llms/.guidelines/frontend/blade/blade-conventions.md
                - _inc/laravel/.notes/.llms/.guidelines/frontend/assets/js-singletons.md
                - _inc/laravel/.notes/.llms/.guidelines/frontend/typescript/typescript-guide.md
            modules:
                - _inc/laravel/.notes/.llms/.guidelines/modules/{accounting,billing,crm,hrm,planning,products}/*-guide.md
            security:
                - _inc/laravel/.notes/.llms/.guidelines/security/security-patterns.xml
                - _inc/laravel/.notes/.llms/.guidelines/security-roleplay-guidelines.md
                - _inc/laravel/.notes/.llms/.guidelines/security-roleplay-profiles.xml
                - _inc/laravel/.notes/.llms/.guidelines/security-test-map.xml
            testing:
                - _inc/laravel/.notes/.llms/.guidelines/testing/test-architecture.json
                - _inc/laravel/.notes/.llms/.guidelines/testing/test_suites.xml
                - _inc/laravel/.notes/.llms/.guidelines/testing/ci.yml
                - _inc/laravel/.notes/.llms/.guidelines/testing/typescript-test-harness.md
                - _inc/laravel/.notes/.llms/route-view-testing-pattern.md
            roles:
                - _inc/laravel/.notes/.llms/.guidelines/roles/agent-roles.md
                - _inc/laravel/.notes/.llms/.guidelines/THE_TESTER.md
            infrastructure:
                - _inc/laravel/.notes/.llms/.guidelines/infrastructure/server.toml
            constraints:
                - _inc/laravel/.notes/.llms/.guidelines/constraints.md
                - _inc/laravel/.notes/.llms/.guidelines/project.yml
        coding-style-guides:
            general:     _inc/laravel/utils/prompts/.guidelines/general/*.{md,xml,yml,toml}
            css:         _inc/laravel/utils/prompts/.guidelines/css/*.{md,xml,yml,toml}
            javascript:  _inc/laravel/utils/prompts/.guidelines/javascript/*.{md,xml,yml,toml}
            php:         _inc/laravel/utils/prompts/.guidelines/php/*.{md,xml,yml,toml}
            python:      _inc/laravel/utils/prompts/.guidelines/python/*.{md,xml,yml,toml}
            react:       _inc/laravel/utils/prompts/.guidelines/react/*.{md,xml,yml,toml}
            typescript:  _inc/laravel/utils/prompts/.guidelines/typescript/*.{md,xml,yml,toml}
        audits:
            - commands:
                - "Save each CLI/grep/regex/find command as a dated entry (YYYYMMDD)."
                - "cli: _inc/laravel/utils/cli/$(date +%Y%m%d)/*.{md,txt,yml}"
                - "regex: _inc/laravel/utils/regex/$(date +%Y%m%d)/*.{md,txt,yml}"
                - "grep: _inc/laravel/utils/grep/$(date +%Y%m%d)/*.{md,txt,yml}"
                - "find: _inc/laravel/utils/find/$(date +%Y%m%d)/*.{md,txt,yml}"
        reports:
            - extension-pick: _inc/laravel/utils/REPORT_FILE_PATTERN.md
    credentials:
        - sudo: .gh/sudo.yml
    note-taking:
        - volatile: .tmp/*
        - durable:
              - _inc/laravel/.notes/*
        - notes: "Update these regularly, not only at the end of a prompt response"
    llm-context:
        - erp-context:   _inc/laravel/utils/.llms/ctx/erp_context.md
        - agent-guides:  _inc/laravel/utils/.llms/ctx/agents/
        - session-notes: _inc/laravel/utils/.llms/notes/
        - cli-history:   _inc/laravel/utils/.llms/cli/
    scripts:
        - volatile: .tmp/scripts/*
        - durable:
              - generic: _inc/laravel/utils/scripts/*
              - app-setup: _inc/laravel/scripts/*
              - app-utils: _inc/laravel/utils/scripts/*
        - archive-policy:
              - one-off-or-host-specific: "Move to nearest .history/scripts/{lang}/YYYYMMDD/ and keep untracked."
              - reusable-only: "Keep reusable automation in _inc/laravel/utils/scripts/*."
        - javascript:
            - guidelines: _inc/laravel/utils/JAVASCRIPT_FILE_PATTERN.md
            - main-paths:
                - _inc/laravel/*.{cjs,mjs}
                - _inc/laravel/{babel.config,jest.config,webpack.mix,playwright.config,playwright-frontend.config}.cjs
                - _inc/laravel/eslint.config.mjs
                - _inc/laravel/tailwind.config.js
                - _inc/laravel/Modules/LandingPage/vite.config.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/js/*.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/js/pages/*.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/js/plugins/*.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/js/plugins/ckeditor/{balloon,classic,document,inline}/*.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/js/plugins/tinymce/*.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/js/plugins/tinymce/{icons/default,themes/mobile,themes/silver}/*.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/js/plugins/tinymce/plugins/**/*.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/css/summernote/*.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/css/summernote/lang/*.js
                - _inc/laravel/Modules/LandingPage/Resources/assets/css/summernote/plugin/{databasic,hello,specialchars}/*.js
                - _inc/laravel/public/assets/js/*.{js,cjs}
                - _inc/laravel/public/assets/js/{core,generic,pages}/*.js
                - _inc/laravel/public/assets/js/plugins/*.js
                - _inc/laravel/public/assets/js/plugins/ckeditor/{balloon,classic,document,inline}/*.js
                - _inc/laravel/public/assets/js/plugins/signature_pad/*.js
                - _inc/laravel/public/assets/js/plugins/tinymce/*.js
                - _inc/laravel/public/assets/js/plugins/tinymce/{icons/default,themes/mobile,themes/silver}/*.js
                - _inc/laravel/public/assets/js/plugins/tinymce/plugins/**/*.js
                - _inc/laravel/public/assets/js/routes/**/*.js
                - _inc/laravel/public/js/*.js
                - _inc/laravel/public/js/chatify/*.js
                - _inc/laravel/public/css/summernote/*.js
                - _inc/laravel/public/css/summernote/lang/*.js
                - _inc/laravel/public/css/summernote/plugin/{databasic,hello,specialchars}/*.js
                - _inc/laravel/public/Modules/landingpage/js/*.js
                - _inc/laravel/public/Modules/landingpage/js/pages/*.js
                - _inc/laravel/public/Modules/landingpage/js/plugins/*.js
                - _inc/laravel/public/Modules/landingpage/js/plugins/ckeditor/{balloon,classic,document,inline}/*.js
                - _inc/laravel/public/Modules/landingpage/js/plugins/tinymce/*.js
                - _inc/laravel/public/Modules/landingpage/js/plugins/tinymce/{icons/default,themes/mobile,themes/silver}/*.js
                - _inc/laravel/public/Modules/landingpage/js/plugins/tinymce/plugins/**/*.js
                - _inc/laravel/public/Modules/landingpage/css/summernote/*.js
                - _inc/laravel/public/Modules/landingpage/css/summernote/lang/*.js
                - _inc/laravel/public/Modules/landingpage/css/summernote/plugin/{databasic,hello,specialchars}/*.js
                - _inc/laravel/resources/js/*.js
                - _inc/laravel/tests/*.cjs
                - _inc/laravel/tests/e2e/*.cjs
                - _inc/laravel/tests/frontend/*.{cjs,mjs}
                - _inc/laravel/tests/frontend/js/*.{js,cjs}
                - _inc/laravel/tests/frontend/js/{coverage,helpers,unit}/*.{js,cjs}
                - _inc/laravel/tests/frontend/js/coverage/lcov-report/*.js
                - _inc/laravel/tests/frontend/js/pages/utils/*.js
                - _inc/laravel/tests/frontend/js/utils/*.js
                - _inc/laravel/tests/postman/scripts/*.cjs
                - _inc/laravel/tests/Unit/frontend/js/*.cjs
                - _inc/laravel/tests/Unit/frontend/js/{core,custom,helpers}/*.cjs
                - _inc/laravel/utils/scripts/js/*.mjs
                - _inc/laravel/utils/scripts/ts-harness/*.cjs
            - notes:
                - "##DO NOT WORK ON THE PATHS WITH */ts/* FOR NOW##"
        - typescript:
            - guidelines: _inc/laravel/utils/TYPESCRIPT_FILE_PATTERN.md
            - main-paths:
                - _inc/laravel/tests/frontend/js/setup.ts
                - _inc/laravel/tests/frontend/js/playwright.config.ts
                - _inc/laravel/tests/frontend/js/types/globals.d.ts
                - _inc/laravel/tests/frontend/js/e2e/*.spec.ts
                - _inc/laravel/tests/frontend/js/core/*.test.ts
                - _inc/laravel/tests/frontend/js/generic/*.test.ts
                - _inc/laravel/tests/frontend/js/pages/*.test.ts
                - _inc/laravel/tests/frontend/js/utils/*.ts
                - _inc/laravel/{public/assets,public/Modules/landingpage,Modules/LandingPage/Resources/assets}/js/plugins/tinymce/tinymce.d.ts
            - notes:
                - "##DO NOT WORK ON THE PATHS WITH */ts/* FOR NOW##"
        - css:
            - guidelines: _inc/laravel/utils/CSS_FILE_PATTERN.md
            - main-paths:
                - _inc/laravel/resources/css/*.css
                - _inc/laravel/public/css/*.css
                - _inc/laravel/public/css/chatify/*.css
                - _inc/laravel/public/css/datatable/*.css
                - _inc/laravel/public/css/summernote/*.css
                - _inc/laravel/public/css/summernote/plugin/databasic/*.css
                - _inc/laravel/public/assets/css/*.css
                - _inc/laravel/public/assets/css/plugins/*.css
                - _inc/laravel/public/assets/css/routes/{auth/login,emails,estimations,invoices,partials/admin,pos,projects/reports,settings,timeTrackers,vendors/chatify}/*.css
                - _inc/laravel/public/assets/fonts/*.css
                - _inc/laravel/public/assets/js/plugins/tinymce/skins/{content/{dark,default,document,writer},ui/{oxide,oxide-dark}}/*.css
                - _inc/laravel/public/installer/css/*.css
                - _inc/laravel/public/installer/css/scss/*.scss
                - _inc/laravel/public/installer/css/scss/font-awesome/*.scss
                - _inc/laravel/public/Modules/landingpage/css/*.css
                - _inc/laravel/public/Modules/landingpage/css/plugins/*.css
                - _inc/laravel/public/Modules/landingpage/css/summernote/*.css
                - _inc/laravel/public/Modules/landingpage/css/summernote/plugin/databasic/*.css
                - _inc/laravel/public/Modules/landingpage/fonts/*.css
                - _inc/laravel/public/Modules/landingpage/{sass,../sass}/*.scss
                - _inc/laravel/public/Modules/landingpage/js/plugins/tinymce/skins/{content/{dark,default,document,writer},ui/{oxide,oxide-dark}}/*.css
                - _inc/laravel/Modules/LandingPage/Resources/assets/css/*.css
                - _inc/laravel/Modules/LandingPage/Resources/assets/css/plugins/*.css
                - _inc/laravel/Modules/LandingPage/Resources/assets/css/summernote/*.css
                - _inc/laravel/Modules/LandingPage/Resources/assets/css/summernote/plugin/databasic/*.css
                - _inc/laravel/Modules/LandingPage/Resources/assets/fonts/*.css
                - _inc/laravel/Modules/LandingPage/Resources/assets/sass/*.scss
                - _inc/laravel/Modules/LandingPage/Resources/assets/js/plugins/tinymce/skins/{content/{dark,default,document,writer},ui/{oxide,oxide-dark}}/*.css
                - _inc/laravel/tests/frontend/js/coverage/*.css
                - _inc/laravel/tests/frontend/js/coverage/lcov-report/*.css
                - _inc/laravel/tests/frontend/js/pages/mocks/common/*.css
        - python:
            - main-paths:
                - _inc/laravel/app/Exports/py/*.py
                - _inc/laravel/app/Imports/py/*.py
                - _inc/laravel/tests/python/*.py
                - _inc/laravel/tests/python/{exports,imports}/*.py
                - _inc/laravel/tests/sh/_generate_curl_tests.py
                - _inc/laravel/tests/postman/scripts/*.py
                - _inc/laravel/utils/scripts/py/*.py
                - _inc/laravel/utils/scripts/py/analysis/*.py
                - _inc/laravel/.tmp/copilot/*/scripts/*.py
                - _inc/laravel/.tmp/copilot/*/fragments/*.py
    tests:
        main-app:
          - phpunit
          - phpstan
          - curl suites
          - wget suites
          - mysql suites
        submodules:
          - playwright
          - jest
          - pytest
    backup:
        - path:
              - .backup/*
              - _inc/laravel/.backup/*
        - note: "This directory contains backup files for contingency operations. Ensure to update, do cleanup, and read from this location as needed."
    ignore:
        - .deprecated/*
        - _old/*
        - origin/*
        - _inc/.seeders/*
    outdated:
        - path: **/.history/*
        - note: "Historical local context and archives. Keep on disk for reference but do not keep tracked in git."
    etc:
        checks:
            - memory-usage: "Monitor memory constantly. You need to review how much memory_limit your're giving to php commands, and be sure to keep track of php and node processes with free, ps -o %mem or ps aux, or even tracking oom risk by calling dmesg or journalctl with grep -i oom or -u earlyoom. Sudo passowrd is available at .gh/sudo.yml, so you can echo sudo -S. Invoke sleeps before tasks until stabilization is achieved, and kill+restart processes as needed to prevent OOM crashes."
        filesystem:
            - long-processing: "For long processing tasks, consider using a dedicated directory for temporary files. This can help prevent clutter and ensure that important files are not accidentally deleted. Regularly review and clean up this directory to maintain an organized workspace. Also, try breaking into subprocedures, like fragments of files, and them merging them together (cleaning up the fragments later), so you don't lose progress, and saving in .tmp/copilot/{datetime}/ the steps you have taken already."
            - issue-tracking:
                  open-issues: _inc/laravel/.notes/KNOWN_ISSUES.md
                  resolved-issues: _inc/laravel/.notes/RESOLVED_ISSUES.md
                  work-journal: _inc/laravel/.notes/CURRENT_WORKING_ISSUES_WORK.md
                  rules:
                      - "KNOWN_ISSUES.md contains ONLY open/unresolved issues"
                      - "When an issue is resolved, move it to RESOLVED_ISSUES.md with HOW it was solved"
                      - "CURRENT_WORKING_ISSUES_WORK.md documents the try/fail/✅success process for each fix"
                      - "Mark successful approaches with ✅ in the work journal"
                  testing-patterns: _inc/laravel/.notes/.llms/route-view-testing-pattern.md

