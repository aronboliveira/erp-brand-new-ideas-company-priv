###############################################################################
# ERP Nova Prestech — MySQL 8.0 para Kubernetes local (minikube)
# Uses emptyDir for ephemeral test data (fresh DB on every deploy).
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
    name: mysql
    namespace: erp-prestech
    labels:
        app: mysql
        app.kubernetes.io/part-of: erp-prestech
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: mysql
    template:
        metadata:
            labels:
                app: mysql
        spec:
            initContainers:
                - name: clean-datadir
                  image: busybox:1.36
                  command: ["sh", "-c", "rm -rf /var/lib/mysql/*"]
                  volumeMounts:
                      - name: mysql-storage
                        mountPath: /var/lib/mysql
            containers:
                - name: mysql
                  image: mysql:8.0
                  ports:
                      - containerPort: 3306
                        name: mysql
                  env:
                      - name: MYSQL_DATABASE
                        value: "erp_prestech_db"
                      - name: MYSQL_USER
                        value: "test"
                      - name: MYSQL_PASSWORD
                        value: "test"
                      - name: MYSQL_ROOT_PASSWORD
                        value: "test"
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "100m"
                      limits:
                          memory: "1Gi"
                          cpu: "500m"
                  volumeMounts:
                      - name: mysql-storage
                        mountPath: /var/lib/mysql
                  startupProbe:
                      exec:
                          command:
                              - mysqladmin
                              - ping
                              - "-h"
                              - "127.0.0.1"
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 60
                  readinessProbe:
                      exec:
                          command:
                              - mysqladmin
                              - ping
                              - "-h"
                              - "127.0.0.1"
                      periodSeconds: 10
                      timeoutSeconds: 5
                  livenessProbe:
                      exec:
                          command:
                              - mysqladmin
                              - ping
                              - "-h"
                              - "127.0.0.1"
                      periodSeconds: 15
                      timeoutSeconds: 5
            volumes:
                - name: mysql-storage
                  emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
    name: mysql-service
    namespace: erp-prestech
    labels:
        app: mysql
spec:
    selector:
        app: mysql
    ports:
        - protocol: TCP
          port: 3306
          targetPort: 3306
    type: ClusterIP
