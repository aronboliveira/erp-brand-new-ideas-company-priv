###############################################################################
# ERP Brand New Ideas Company — Frontend Deployment (placeholder / Inertia SSR optional)
# O frontend principal é SSR via Blade (servido pelo backend).
# Este deployment é reservado para apps frontend separadas (ex: Inertia SSR,
# Next.js, etc.) quando necessário.
# NOTA: Atualmente o frontend é integrado ao backend via Blade + Mix.
#       Este manifesto pode ser ativado quando houver separação de frontend.
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
    name: erp-frontend
    namespace: erp-brand-new-ideas-company
    labels:
        app: erp-frontend
        app.kubernetes.io/part-of: erp-brand-new-ideas-company
spec:
    replicas: 0 # Desativado — o frontend é servido pelo backend Blade/Mix
    selector:
        matchLabels:
            app: erp-frontend
    template:
        metadata:
            labels:
                app: erp-frontend
        spec:
            containers:
                - name: frontend
                  # image: acr-name.azurecr.io/erp-frontend:latest  # Azure ACR (comentado)
                  image: erp-brand-new-ideas-company-frontend:latest
                  imagePullPolicy: Never
                  ports:
                      - containerPort: 3000
                  env:
                      - name: NODE_ENV
                        value: "production"
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "100m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
    name: erp-frontend
    namespace: erp-brand-new-ideas-company
    labels:
        app: erp-frontend
spec:
    selector:
        app: erp-frontend
    ports:
        - protocol: TCP
          port: 80
          targetPort: 3000
    type: ClusterIP
