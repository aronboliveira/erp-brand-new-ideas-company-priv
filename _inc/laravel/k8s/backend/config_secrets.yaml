###############################################################################
# ERP Nova Prestech — ConfigMap & Secrets para Kubernetes local (minikube)
# IMPORTANTE: Em produção, use soluções externas de secrets (Vault, Sealed Secrets).
#             Os valores abaixo são EXCLUSIVAMENTE para desenvolvimento local.
###############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
    name: erp-backend-config
    namespace: erp-prestech
    labels:
        app.kubernetes.io/part-of: erp-prestech
data:
    APP_NAME: "ERP Nova Prestech"
    APP_ENV: "local"
    APP_DEBUG: "true"
    APP_URL: "http://localhost"
    APP_TIMEZONE: "America/Sao_Paulo"
    LOG_CHANNEL: "stack"
    DB_CONNECTION: "mysql"
    DB_HOST: "mysql-service"
    DB_PORT: "3306"
    DB_DATABASE: "erp_prestech_db"
    BROADCAST_DRIVER: "log"
    CACHE_DRIVER: "file"
    QUEUE_CONNECTION: "sync"
    SESSION_DRIVER: "file"
    SESSION_SECURE_COOKIE: "false"
    REDIS_HOST: "redis-service"
    REDIS_PORT: "6379"
    SEED_PROFILE: "standard"

---
apiVersion: v1
kind: Secret
metadata:
    name: erp-backend-secrets
    namespace: erp-prestech
    labels:
        app.kubernetes.io/part-of: erp-prestech
type: Opaque
stringData:
    # Secrets apenas para desenvolvimento local — NÃO usar em produção.
    # Em produção, utilize Azure Key Vault, Sealed Secrets ou external-secrets.
    APP_KEY: "base64:PzVFLmnibiIC5Xk0rDrp0zzHXI8YQD5FKRuzrU+banw="
    DB_DATABASE: "erp_prestech_db"
    DB_USERNAME: "test"
    DB_PASSWORD: "test"
    DB_ROOT_PASSWORD: "test"
    REDIS_PASSWORD: ""
