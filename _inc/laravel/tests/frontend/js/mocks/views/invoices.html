<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="test-csrf-token-abc123" />
    <title>Mock Invoice List</title>
  </head>
  <body>
    <div class="dash-container">
      <div class="dash-content">
        <div class="page-header">
          <div class="page-block">
            <div class="row">
              <div class="col-md-6"><h3 class="page-title">Invoices</h3></div>
              <div class="col-md-6 text-end">
                <a href="/invoices/create" class="btn btn-primary">
                  <i data-feather="plus"></i> Create Invoice
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Section -->
        <div class="card mb-3" id="filter-section">
          <div class="card-body">
            <form id="filter-form">
              <div class="row">
                <div class="col-md-3">
                  <select name="status" class="form-select" id="status-filter">
                    <option value="">All Status</option>
                    <option value="paid">Paid</option>
                    <option value="unpaid">Unpaid</option>
                    <option value="partial">Partially Paid</option>
                    <option value="overdue">Overdue</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <input
                    type="date"
                    name="start_date"
                    class="form-control"
                    id="start-date"
                  />
                </div>
                <div class="col-md-3">
                  <input
                    type="date"
                    name="end_date"
                    class="form-control"
                    id="end-date"
                  />
                </div>
                <div class="col-md-3">
                  <button type="submit" class="btn btn-primary">Filter</button>
                </div>
              </div>
            </form>
          </div>
        </div>

        <!-- Invoice Table -->
        <div class="card">
          <div class="card-body">
            <table class="table table-hover" id="invoices-table">
              <thead>
                <tr>
                  <th><input type="checkbox" id="select-all" /></th>
                  <th>Invoice #</th>
                  <th>Customer</th>
                  <th>Issue Date</th>
                  <th>Due Date</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="invoices-tbody">
                <tr data-id="inv-001">
                  <td><input type="checkbox" class="row-select" /></td>
                  <td>INV-001</td>
                  <td>Acme Corp</td>
                  <td>2025-01-15</td>
                  <td>2025-02-15</td>
                  <td>$1,500.00</td>
                  <td><span class="badge bg-success">Paid</span></td>
                  <td>
                    <a href="/invoices/inv-001" class="btn btn-sm btn-info"
                      ><i data-feather="eye"></i
                    ></a>
                    <a
                      href="/invoices/inv-001/edit"
                      class="btn btn-sm btn-warning"
                      ><i data-feather="edit"></i
                    ></a>
                    <button
                      class="btn btn-sm btn-danger delete-btn"
                      data-id="inv-001"
                    >
                      <i data-feather="trash-2"></i>
                    </button>
                  </td>
                </tr>
                <tr data-id="inv-002">
                  <td><input type="checkbox" class="row-select" /></td>
                  <td>INV-002</td>
                  <td>Widget Inc</td>
                  <td>2025-01-20</td>
                  <td>2025-02-20</td>
                  <td>$3,200.00</td>
                  <td><span class="badge bg-warning">Unpaid</span></td>
                  <td>
                    <a href="/invoices/inv-002" class="btn btn-sm btn-info"
                      ><i data-feather="eye"></i
                    ></a>
                    <a
                      href="/invoices/inv-002/edit"
                      class="btn btn-sm btn-warning"
                      ><i data-feather="edit"></i
                    ></a>
                    <button
                      class="btn btn-sm btn-danger delete-btn"
                      data-id="inv-002"
                    >
                      <i data-feather="trash-2"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Pagination -->
        <nav aria-label="Invoice pagination">
          <ul class="pagination" id="invoice-pagination">
            <li class="page-item disabled">
              <a class="page-link" href="#">Previous</a>
            </li>
            <li class="page-item active">
              <a class="page-link" href="#">1</a>
            </li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </body>
</html>
