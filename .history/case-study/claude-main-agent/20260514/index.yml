issues_closed:
  retry:
    - id: R-1
      severity: HIGH
      title: Retry::run never actually slept
      fix: Default sleep(intervalSeconds) inside the loop; existing callers opted out with ->withSleep(false)
    - id: R-2
      severity: MEDIUM
      title: No jitter on retryDelaySeconds
      fix: ReliabilityPolicy::jitter() applied with ±15% factor
    - id: R-3
      severity: MEDIUM
      title: Empty retryOn meant retry-on-Throwable
      fix: Falls back to ReliabilityPolicy::TRANSIENT_EXCEPTIONS allowlist; ->retryOnAny() for explicit opt-in
    - id: R-4
      severity: LOW
      title: No recover/fallback hook
      fix: RetryBuilder::recoverWith() — Spring @Recover analogue
    - id: R-5
      severity: LOW
      title: Seconds-only granularity
      fix: RetryBuilder::intervalUsingMillis() + internal usleep
    - id: R-6
      severity: INFO
      title: Reflection on every attempt
      fix: Hoisted to once per run() entry
    - id: R-7
      severity: INFO
      title: shouldRetry precedence undocumented
      fix: Inline docblock describing abortOn → handlers → retryOn order

  circuit_breaker:
    - id: CB-1
      severity: HIGH
      title: Half-open admission counted only completed calls
      fix: tryAcquirePermit writes a 'permitted' call row under lockForUpdate
    - id: CB-2
      severity: MEDIUM
      title: open→half_open transition race
      fix: prepareState wraps the transition in DB::transaction with lockForUpdate + re-check under lock
    - id: CB-3
      severity: MEDIUM
      title: No jitter on next_attempt_at
      fix: addSeconds(ReliabilityPolicy::jitter($this->openStateSeconds))
    - id: CB-4
      severity: MEDIUM
      title: No slow-call rate detection
      fix: Optional slow_call_duration_ms + slow_call_rate_threshold columns; builder slowCallThreshold($ms, $rate)
    - id: CB-5
      severity: LOW
      title: halfOpenSuccessThreshold builder floor too high
      fix: 25% → 1%; tier-defaults preserved
    - id: CB-6
      severity: LOW
      title: Non-conservative mode wasted probes after threshold unreachable
      fix: Early re-open when math says threshold unreachable
    - id: CB-7
      severity: LOW
      title: CIRCUIT_DISABLED state unreachable
      fix: CircuitBreakerState::disable($reason) / enable() ops handles

  commit_path:
    - id: F-1
      severity: HIGH
      title: Ledger status flip outside transaction
      fix: Moved succeedStep + ledger forceFill(committed) + operation.committed event INSIDE DB::transaction as last writes; defensive try/catch on failure-path writes
    - id: F-2
      severity: HIGH
      title: No deadlock retry on commit
      fix: DB::transaction($callback, ReliabilityPolicy::commitRetryAttempts($criticality))
    - id: F-3
      severity: LOW
      title: Orphaned 'started' ledgers from residual sub-ms crash window
      fix: ReliabilityLedgerSweepService + reliability:sweep-orphaned-ledgers

  quarantine:
    - id: Q-1
      severity: HIGH
      title: Domain enum missed 3 production domains; silent truncation under strict=false
      fix: New migration extends enum to 7 values; audit action enum adds 'dismissed'
    - id: Q-2
      severity: MEDIUM
      title: QuarantineService::route failure masked the original exception
      fix: Defensive try/catch in all 5 domain operation services; original exception propagates with quarantine()=null
    - id: Q-3
      severity: LOW
      title: Judge hardcoded domain decisions
      fix: ReliabilityPolicy::quarantineDecisionFor as single source of truth; judge reduced to a 13-line wrapper
    - id: Q-4
      severity: MEDIUM
      title: No recover/dismiss workflow
      fix: OperationQuarantine::recover() / dismiss() + audit row writes
    - id: Q-5
      severity: LOW
      title: actor_type enum too narrow
      fix: Extended to ('system','human','judge','scheduler'); judge_decision audits now write actor_type='judge'
    - id: Q-6
      severity: LOW
      title: No expired-quarantine GC
      fix: QuarantineRetentionSweepService + reliability:sweep-expired-quarantines
    - id: Q-7
      severity: HIGH  # data recovery for affected deployments
      title: Pre-Q1 truncated rows have lost domain attribution
      fix: reliability:backfill-quarantine-domains recovers from operation_ledgers.domain

