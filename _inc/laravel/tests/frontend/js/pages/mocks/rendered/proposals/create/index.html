<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Create proposals</title></head>
<body class="layout-admin">
  <header class="dash-header"><nav class="navbar"><span class="navbar-brand">ERP</span></nav></header>
  <div class="dash-container">
    <div class="dash-content">
      <div class="page-header"><h4>Create proposals</h4></div>
      <div class="card"><div class="card-body">
        <form id="createForm" method="POST">
          <input type="text" name="name" placeholder="Name" class="form-control">
          <input type="email" name="email" placeholder="Email" class="form-control">
          <input type="number" name="amount" placeholder="Amount" class="form-control">
          <button type="submit" class="btn btn-primary">Save</button>
        </form>
      </div></div>
    </div>
  </div>
</body>
</html>
