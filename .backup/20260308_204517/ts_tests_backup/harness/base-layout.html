<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="test-csrf-token-12345" />
    <title>TS Build Test Harness</title>
    <!-- Bootstrap 5 CDN (production uses this) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .test-status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
      }
      .test-status.pass {
        background: #d4edda;
        color: #155724;
      }
      .test-status.fail {
        background: #f8d7da;
        color: #721c24;
      }
      .test-status.pending {
        background: #fff3cd;
        color: #856404;
      }
      #test-output {
        font-family: monospace;
        font-size: 12px;
        max-height: 300px;
        overflow: auto;
      }
      .route-test {
        border: 1px solid #ddd;
        padding: 15px;
        margin: 10px 0;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container mt-4">
      <h1>TypeScript Build Test Harness</h1>
      <p class="text-muted">Testing compiled output from ts/dist/</p>
      <div id="test-status" class="test-status pending">Status: Loading...</div>
      <div id="test-output"></div>
      <hr />
      <!-- Page-specific content inserted here -->
      <div id="page-content"></div>
    </div>

    <!-- Bootstrap 5 Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery (many routes depend on it) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Test utilities -->
    <script>
      window.testLog = [];
      window.logTest = function (msg, isError = false) {
        const entry = { time: new Date().toISOString(), msg, isError };
        window.testLog.push(entry);
        const output = document.getElementById("test-output");
        if (output) {
          output.innerHTML +=
            '<div style="color:' +
            (isError ? "red" : "green") +
            '">[' +
            entry.time +
            "] " +
            msg +
            "</div>";
        }
        console[isError ? "error" : "log"](msg);
      };
      window.setTestStatus = function (status, msg) {
        const el = document.getElementById("test-status");
        if (el) {
          el.className = "test-status " + status;
          el.textContent = "Status: " + msg;
        }
      };
      window.onerror = function (msg, url, line, col, error) {
        window.logTest("ERROR: " + msg + " at " + url + ":" + line, true);
        window.setTestStatus("fail", "Script error occurred");
        return false;
      };
    </script>
  </body>
</html>
