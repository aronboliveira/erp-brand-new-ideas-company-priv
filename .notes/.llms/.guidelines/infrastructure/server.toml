# ERP Nova Prestech — Server & DevOps Configuration
# Format: TOML (unix-service and deploy-config patterns)
# Last updated: 2026-03-01
# Purpose: Artisan commands, logging paths, git remotes, supervisor-style configs

[server]
host        = "127.0.0.1"
port        = 8000
command     = "php artisan serve --host=127.0.0.1 --port=8000"
url         = "http://127.0.0.1:8000"
working_dir = "_inc/laravel"
login_url   = "/login"

[server.credentials]
email    = "suporte@prestech.com.br"
password = "test1234"

# ─── Artisan Commands ──────────────────────────────────────────────────────────

[artisan.cache]
clear_all    = "php artisan optimize:clear"
clear_views  = "php artisan view:clear"
clear_routes = "php artisan route:clear"
clear_config = "php artisan config:clear"
clear_events = "php artisan event:clear"
route_list   = "php artisan route:list"
route_count  = "php artisan route:list | wc -l"

[artisan.autoload]
dump           = "composer dump-autoload"
dump_optimized = "composer dump-autoload -o"

[artisan.seeds]
content        = "php artisan db:seed --class=ContentValidationSeeder"
soft           = "composer serve-sh-soft"
mixed          = "composer serve-sh-mixed"
hard           = "composer serve-sh-hard"

[artisan.migrations]
run            = "php artisan migrate"
rollback       = "php artisan migrate:rollback"
status         = "php artisan migrate:status"

# ⛔ NEVER RUN — wipes production data:
# fresh        = "php artisan migrate:fresh"
# test         = "php artisan test"

[artisan.testing]
phpunit_unit       = "php artisan test --testsuite=Unit"
phpunit_feature    = "php artisan test --testsuite=Feature"
phpunit_filter     = "php artisan test --filter={ClassName}"
jest_frontend      = "npx jest tests/frontend/js/"
jest_root          = "npx jest --config=jest.config.cjs"
playwright_all     = "npx playwright test --config=playwright-frontend.config.cjs"
playwright_chromium = "npx playwright test --config=playwright-frontend.config.cjs --project=chromium"
playwright_grep    = "npx playwright test --config=playwright-frontend.config.cjs -g \"{pattern}\""

# ─── Logging ───────────────────────────────────────────────────────────────────

[logs]
main           = "storage/logs/laravel.log"
volatile       = "storage/logs/volatile-*.log"
short_lived    = "storage/logs/short_lived-*.log"
warnings       = "storage/logs/warning_trace-*.log"
truncate_cmd   = "composer clear-logs"
tail_main      = "tail -f _inc/laravel/storage/logs/laravel.log"
tail_volatile  = "tail -f _inc/laravel/storage/logs/volatile-*.log"

# ─── Git ───────────────────────────────────────────────────────────────────────

[git]
branch           = "main"
remote_name      = "origin"
remote_url       = "https://github.com/aronboliveira/erp-prestech-priv"
old_remote_name  = "comp"
old_remote_url   = "https://github.com/Desenvolvimento-Prestch/erp_unix"
commit_convention = "type(scope): description\n\n- bullet points"

[git.ignored_dirs]
"_old/"        = "Legacy fork code — reference only, never edit"
"origin/"      = "Legacy export directory — do not import"
".deprecated/" = "Deprecated modules (django, etc.)"
".tmp/"        = "Temporary files, test artifacts"

# ─── Composer Scripts ──────────────────────────────────────────────────────────

[composer]
serve_sh_soft   = "composer serve-sh-soft"
serve_sh_mixed  = "composer serve-sh-mixed"
serve_sh_hard   = "composer serve-sh-hard"
clear_logs      = "composer clear-logs"
dump_autoload   = "composer dump-autoload -o"

# ─── Docker (if applicable) ────────────────────────────────────────────────────

[docker]
compose_file = "_inc/laravel/docker-compose.yml"
dockerfile   = "_inc/laravel/Dockerfile"
nginx_conf   = "_inc/laravel/nginx/default.conf"
php_ini      = "_inc/laravel/php/local.ini"

# ─── Supervisor (process manager pattern) ──────────────────────────────────────

[supervisor.laravel_worker]
command   = "php artisan queue:work sync --sleep=3 --tries=3"
directory = "/path/to/_inc/laravel"
autostart = true
autorestart = true
user      = "www-data"
numprocs  = 1
redirect_stderr = true
stdout_logfile  = "/path/to/storage/logs/worker.log"
