<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="test-csrf-token-abc123" />
    <title>Mock Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="loader-bg">
      <div class="loader"><span></span></div>
    </div>

    <div class="dash-sidebar">
      <div class="navbar-content">
        <ul class="dash-navbar">
          <li class="dash-item dash-hasmenu">
            <a href="/account-dashboard" class="dash-link">
              <span class="dash-micon"><i data-feather="home"></i></span>
              <span class="dash-mtext">Dashboard</span>
            </a>
            <ul class="dash-submenu" style="display: none">
              <li><a href="/account-dashboard">Account Dashboard</a></li>
            </ul>
          </li>
          <li class="dash-item">
            <a href="/invoices" class="dash-link">
              <span class="dash-micon"><i data-feather="file-text"></i></span>
              <span class="dash-mtext">Invoices</span>
            </a>
          </li>
          <li class="dash-item">
            <a href="/bills" class="dash-link">
              <span class="dash-micon"><i data-feather="file"></i></span>
              <span class="dash-mtext">Bills</span>
            </a>
          </li>
          <li class="dash-item">
            <a href="/employees" class="dash-link">
              <span class="dash-micon"><i data-feather="users"></i></span>
              <span class="dash-mtext">Employees</span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <div class="topbar">
      <div class="hamburger">☰</div>
      <div id="overlay-menu">Overlay</div>
      <div id="vertical-nav-toggle">Toggle</div>
      <div id="mobile-collapse">Mobile</div>
    </div>

    <div class="dash-container">
      <div class="dash-content">
        <div class="page-header">
          <div class="page-block">
            <div class="row align-items-center">
              <div class="col-md-12">
                <h3 class="page-title">Dashboard</h3>
              </div>
            </div>
          </div>
        </div>

        <!-- Widget Cards -->
        <div class="row" id="dashboard-widgets">
          <div class="col-lg-3 col-md-6">
            <div class="card" data-widget="total-customers">
              <div class="card-body">
                <h6 class="mb-2">Total Customers</h6>
                <h3 class="f-w-300 widget-value">0</h3>
              </div>
            </div>
          </div>
          <div class="col-lg-3 col-md-6">
            <div class="card" data-widget="total-invoices">
              <div class="card-body">
                <h6 class="mb-2">Total Invoices</h6>
                <h3 class="f-w-300 widget-value">0</h3>
              </div>
            </div>
          </div>
          <div class="col-lg-3 col-md-6">
            <div class="card" data-widget="total-revenue">
              <div class="card-body">
                <h6 class="mb-2">Total Revenue</h6>
                <h3 class="f-w-300 widget-value">$0.00</h3>
              </div>
            </div>
          </div>
          <div class="col-lg-3 col-md-6">
            <div class="card" data-widget="total-bills">
              <div class="card-body">
                <h6 class="mb-2">Total Bills</h6>
                <h3 class="f-w-300 widget-value">0</h3>
              </div>
            </div>
          </div>
        </div>

        <!-- Data Table -->
        <div class="row">
          <div class="col-md-12">
            <div class="card">
              <div class="card-header d-flex justify-content-between">
                <h5>Recent Invoices</h5>
              </div>
              <div class="card-body">
                <table class="table" id="invoices-table">
                  <thead>
                    <tr>
                      <th>#</th>
                      <th>Invoice ID</th>
                      <th>Customer</th>
                      <th>Amount</th>
                      <th>Status</th>
                      <th>Date</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="invoices-tbody">
                    <!-- Dynamic rows loaded via JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
